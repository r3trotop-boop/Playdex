<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>
<style>
body { margin:0; overflow:hidden; background:#0b0b12; font-family:Arial; }
canvas { display:block; }
#hud { position:absolute; top:10px; left:10px; color:white; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="hud"></div>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

// WORLD
const world = { w: 3000, h: 3000 };

// CAMERA
const cam = { x:0, y:0 };

// PLAYER (FORCED SAFE SPAWN)
const player = {
  x: world.w/2,
  y: world.h/2,
  r: 20,
  mass: 20,
  name: "Player"
};

// INPUT
const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// FOOD
const food = [];
for(let i=0;i<500;i++){
  food.push({
    x: Math.random()*world.w,
    y: Math.random()*world.h,
    r: 3
  });
}

// NAMES
const names = ["Noob","Pro","Shadow","Pixel","King","Lil","Mega","Ultra","Xx","Bot"];

function randName(){
  return names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
}

// BOTS (50)
const bots = [];
for(let i=0;i<50;i++){
  bots.push({
    x: Math.random()*world.w,
    y: Math.random()*world.h,
    mass: 10+Math.random()*30,
    speed: 1.5+Math.random(),
    name: randName()
  });
}

// UTIL
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function size(m){ return 5 + Math.sqrt(m)*3; }

// PLAYER UPDATE
function updatePlayer(){
  let sp = 4;

  if(keys["w"]||keys["arrowup"]) player.y -= sp;
  if(keys["s"]||keys["arrowdown"]) player.y += sp;
  if(keys["a"]||keys["arrowleft"]) player.x -= sp;
  if(keys["d"]||keys["arrowright"]) player.x += sp;

  player.x = Math.max(0,Math.min(world.w,player.x));
  player.y = Math.max(0,Math.min(world.h,player.y));

  // eat food
  for(let i=food.length-1;i>=0;i--){
    if(dist(player,food[i]) < size(player.mass)){
      player.mass++;
      food[i].x = Math.random()*world.w;
      food[i].y = Math.random()*world.h;
    }
  }
}

// BOT AI (simple safe)
function updateBots(){
  for(let b of bots){
    let target = food[0];

    for(let f of food){
      if(dist(b,f) < dist(b,target)) target = f;
    }

    let a = Math.atan2(target.y-b.y, target.x-b.x);
    b.x += Math.cos(a)*b.speed;
    b.y += Math.sin(a)*b.speed;

    for(let i=food.length-1;i>=0;i--){
      if(dist(b,food[i]) < size(b.mass)){
        b.mass += 0.5;
        food[i].x = Math.random()*world.w;
        food[i].y = Math.random()*world.h;
      }
    }
  }
}

// CAMERA (SAFE)
function updateCamera(){
  cam.x = player.x - innerWidth/2;
  cam.y = player.y - innerHeight/2;
}

// DRAW (PLAYER ALWAYS HERE)
function draw(){
  ctx.clearRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-cam.x,-cam.y);

  // food
  ctx.fillStyle="red";
  for(let f of food){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  // bots
  ctx.fillStyle="cyan";
  for(let b of bots){
    ctx.beginPath();
    ctx.arc(b.x,b.y,size(b.mass),0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.fillText(b.name,b.x-10,b.y-15);
    ctx.fillStyle="cyan";
  }

  // PLAYER (FORCED VISIBLE)
  ctx.fillStyle="lime";
  ctx.beginPath();
  ctx.arc(player.x,player.y,size(player.mass),0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.fillText(player.name,player.x-10,player.y-15);

  ctx.restore();

  document.getElementById("hud").innerHTML =
    "Mass: " + Math.floor(player.mass);
}

// LOOP
function loop(){
  updatePlayer();
  updateBots();
  updateCamera();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
