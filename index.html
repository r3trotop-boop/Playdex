<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Playdex IO Smooth</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#050514;
  font-family:Arial;
}

canvas{display:block;}

/* BIG HUD */
#hud{
  position:absolute;
  top:15px;
  left:15px;
  color:white;
  font-size:18px;
}

#lb{
  position:absolute;
  top:15px;
  right:15px;
  width:260px;
  padding:15px;
  background:rgba(0,0,0,0.5);
  border-radius:12px;
  color:white;
  font-size:16px;
}

/* MENU BIGGER */
#menu{
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#1a1a2e,#000);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
}

input,button{
  padding:12px;
  margin:6px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  background:limegreen;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="menu">
  <h1>PLAYDEX IO</h1>
  <input id="name" placeholder="Name">
  <input type="color" id="color" value="#00ff00">
  <button onclick="start()">Start</button>
</div>

<div id="hud"></div>
<div id="lb"></div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

// WORLD
const world={w:4000,h:4000};

// CAMERA (SMOOTH)
const cam={x:0,y:0};

// PLAYER
const player={
  x:world.w/2,
  y:world.h/2,
  vx:0,
  vy:0,
  mass:20,
  color:"#00ff00",
  name:"Player"
};

// INPUT
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// FOOD
const food=[];
for(let i=0;i<700;i++) food.push(makeFood());

function makeFood(){
  return{
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    r:3
  };
}

// NAME SYSTEM
const names=["Shadow","Pixel","Nova","Blaze","King","Noob","Ghost","Ultra","Pro","Xx"];

function randName(){
  return names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
}

// BOTS (20 ONLY)
const bots=[];
for(let i=0;i<20;i++) bots.push(makeBot());

function makeBot(){
  return{
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    vx:0,
    vy:0,
    mass:5+Math.random()*80,
    speed:1.2+Math.random(),
    name:randName(),
    color:`hsl(${Math.random()*360},70%,60%)`
  };
}

// START
function start(){
  player.name=document.getElementById("name").value||randName();
  player.color=document.getElementById("color").value;
  document.getElementById("menu").style.display="none";
  loop();
}

// UTIL
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function size(m){return 5+Math.sqrt(m)*3;}

// ==========================
// PLAYER (SMOOTH + WEIGHTED)
// ==========================
function updatePlayer(){

  let ax=0,ay=0;
  let sp=0.5 + size(player.mass)*0.01; // heavier = slower

  if(keys["w"]||keys["arrowup"]) ay-=sp;
  if(keys["s"]||keys["arrowdown"]) ay+=sp;
  if(keys["a"]||keys["arrowleft"]) ax-=sp;
  if(keys["d"]||keys["arrowright"]) ax+=sp;

  player.vx=(player.vx+ax)*0.85;
  player.vy=(player.vy+ay)*0.85;

  player.x+=player.vx;
  player.y+=player.vy;

  player.x=Math.max(0,Math.min(world.w,player.x));
  player.y=Math.max(0,Math.min(world.h,player.y));

  // eat food
  for(let i=food.length-1;i>=0;i--){
    if(dist(player,food[i])<size(player.mass)){
      player.mass+=1;
      food[i]=makeFood();
    }
  }

  // bots interaction
  for(let i=bots.length-1;i>=0;i--){
    let b=bots[i];

    let ps=size(player.mass);
    let bs=size(b.mass);
    let d=dist(player,b);

    if(ps>bs*1.2 && d<ps){
      player.mass+=b.mass*0.8;
      bots.splice(i,1);
      bots.push(makeBot());
    }

    if(bs>ps*1.2 && d<bs){
      player.mass=20;
      player.x=world.w/2;
      player.y=world.h/2;
    }
  }
}

// ==========================
// BOT AI (SMOOTH + NO STUCK)
// ==========================
function updateBots(){

  for(let b of bots){

    let bx=0,by=0;
    let bS=size(b.mass);

    let target=null;
    let threat=null;

    for(let o of bots){
      if(o===b) continue;

      let d=dist(b,o);

      if(bS>size(o.mass)*1.2 && d<500) target=o;
      if(size(o.mass)>bS*1.2 && d<500) threat=o;
    }

    let pd=dist(b,player);

    if(bS>size(player.mass)*1.2 && pd<500) target=player;
    if(size(player.mass)>bS*1.2 && pd<500) threat=player;

    if(threat){
      let a=Math.atan2(b.y-threat.y,b.x-threat.x);
      bx+=Math.cos(a)*2;
      by+=Math.sin(a)*2;
    }else if(target){
      let a=Math.atan2(target.y-b.y,target.x-b.x);
      bx+=Math.cos(a)*1.5;
      by+=Math.sin(a)*1.5;
    }else{
      bx+=(Math.random()-0.5)*0.5;
      by+=(Math.random()-0.5)*0.5;
    }

    b.vx=(b.vx+bx)*0.9;
    b.vy=(b.vy+by)*0.9;

    b.x+=b.vx*b.speed;
    b.y+=b.vy*b.speed;

    // FOOD MAGNET (soft attraction)
    for(let f of food){
      let d=dist(b,f);
      if(d<120){
        f.x+=(b.x-f.x)*0.002;
        f.y+=(b.y-f.y)*0.002;
      }
    }

    for(let i=food.length-1;i>=0;i--){
      if(dist(b,food[i])<bS){
        b.mass+=0.5;
        food[i]=makeFood();
      }
    }
  }
}

// ==========================
// CAMERA SMOOTH
// ==========================
function updateCam(){
  cam.x+=(player.x-innerWidth/2-cam.x)*0.08;
  cam.y+=(player.y-innerHeight/2-cam.y)*0.08;
}

// ==========================
// DRAW
// ==========================
function draw(){

  ctx.fillStyle="#050514";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-cam.x,-cam.y);

  // food
  ctx.fillStyle="red";
  for(let f of food){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  // bots
  for(let b of bots){
    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,size(b.mass),0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="12px Arial";
    ctx.fillText(b.name,b.x,b.y);
  }

  // player
  ctx.fillStyle=player.color;
  ctx.beginPath();
  ctx.arc(player.x,player.y,size(player.mass),0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.font="14px Arial";
  ctx.fillText(player.name,player.x,player.y);

  ctx.restore();

  document.getElementById("hud").innerHTML=
    "Mass: "+Math.floor(player.mass);
}

// ==========================
// LEADERBOARD BIGGER
// ==========================
function lb(){

  let list=[...bots,player]
    .sort((a,b)=>b.mass-a.mass)
    .slice(0,10);

  document.getElementById("lb").innerHTML=
    "<b style='font-size:18px'>TOP 10</b><br>"+
    list.map((p,i)=>`${i+1}. ${p.name} (${Math.floor(p.mass)})`).join("<br>");
}

// LOOP
function loop(){
  updatePlayer();
  updateBots();
  updateCam();
  lb();
  draw();
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
