<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #0b0b0f;
    font-family: Arial;
  }

  canvas {
    display: block;
  }

  #menu {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #1a1a2e, #000);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
  }

  button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: limegreen;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="menu">
  <h1>Playdex IO</h1>
  <button onclick="startGame()">Start</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WORLD
const world = { width: 3000, height: 3000 };

// CAMERA
const cam = { x: 0, y: 0 };

// PLAYER
const player = {
  x: 1500,
  y: 1500,
  size: 20,
  speed: 3.5,
  score: 0
};

// FOOD SETTINGS (FIXED BIG AMOUNT)
const MAX_FOOD = 600;
let foods = [];

function spawnFood() {
  foods.push({
    x: Math.random() * world.width,
    y: Math.random() * world.height,
    size: 4
  });
}

for (let i = 0; i < MAX_FOOD; i++) {
  spawnFood();
}

// BOTS
let bots = [];
for (let i = 0; i < 10; i++) {
  bots.push({
    x: Math.random() * world.width,
    y: Math.random() * world.height,
    size: 18,
    speed: 2
  });
}

// CONTROLS
const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

let running = false;

function startGame() {
  document.getElementById("menu").style.display = "none";
  running = true;
  loop();
}

// PLAYER
function updatePlayer() {
  if (keys["w"] || keys["ArrowUp"]) player.y -= player.speed;
  if (keys["s"] || keys["ArrowDown"]) player.y += player.speed;
  if (keys["a"] || keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["d"] || keys["ArrowRight"]) player.x += player.speed;

  player.x = Math.max(0, Math.min(world.width, player.x));
  player.y = Math.max(0, Math.min(world.height, player.y));

  for (let i = foods.length - 1; i >= 0; i--) {
    let f = foods[i];
    if (Math.hypot(player.x - f.x, player.y - f.y) < player.size) {
      player.size += 0.3;
      player.score++;
      foods.splice(i, 1);
      spawnFood(); // ALWAYS KEEP FOOD FULL
    }
  }
}

// BOTS
function updateBots() {
  bots.forEach(b => {
    let target = foods[0];

    for (let f of foods) {
      if (Math.hypot(b.x - f.x, b.y - f.y) < Math.hypot(b.x - target.x, b.y - target.y)) {
        target = f;
      }
    }

    let angle = Math.atan2(target.y - b.y, target.x - b.x);
    b.x += Math.cos(angle) * b.speed;
    b.y += Math.sin(angle) * b.speed;
  });
}

// CAMERA
function updateCamera() {
  cam.x += (player.x - canvas.width / 2 - cam.x) * 0.08;
  cam.y += (player.y - canvas.height / 2 - cam.y) * 0.08;
}

// DRAW
function draw() {
  ctx.fillStyle = "#0b0b0f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // FOOD
  for (let f of foods) {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // BOTS
  for (let b of bots) {
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // PLAYER
  ctx.fillStyle = "lime";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + player.score, 20, 30);
}

// LOOP
function loop() {
  if (!running) return;

  updatePlayer();
  updateBots();
  updateCamera();
  draw();

  requestAnimationFrame(loop);
}
</script>

</body>
</html>
