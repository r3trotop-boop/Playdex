<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #050510;
  font-family: Arial;
}

canvas { display: block; }

/* MENU */
#menu, #pauseMenu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1a1a2e, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}

button {
  margin-top: 10px;
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: limegreen;
  cursor: pointer;
}

input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

/* HUD */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-size: 16px;
}

/* LEADERBOARD */
#leaderboard {
  position: absolute;
  top: 10px;
  right: 10px;
  color: white;
  background: rgba(0,0,0,0.4);
  padding: 10px;
  border-radius: 10px;
  width: 180px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>PLAYDEX IO</h1>
  <input id="nameInput" placeholder="Name">
  <button onclick="startGame()">Start</button>
</div>

<div id="pauseMenu" style="display:none;">
  <h1>Paused</h1>
  <button onclick="resumeGame()">Resume</button>
  <button onclick="exitGame()">Exit to Menu</button>
</div>

<div id="hud"></div>
<div id="leaderboard"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const world = { w: 4000, h: 4000 };
const cam = { x: 0, y: 0 };

let running = false;
let paused = false;

// PLAYER
let player = {
  x: 2000,
  y: 2000,
  mass: 20,
  speed: 4,
  stamina: 100,
  name: "Player"
};

// FOOD
const foods = [];
for (let i = 0; i < 600; i++) spawnFood();

function spawnFood() {
  foods.push({
    x: Math.random() * world.w,
    y: Math.random() * world.h,
    r: 3
  });
}

// BOTS
const bots = [];
for (let i = 0; i < 12; i++) bots.push(createBot());

function createBot() {
  return {
    x: Math.random() * world.w,
    y: Math.random() * world.h,
    mass: 10 + Math.random() * 40,
    speed: 1.5 + Math.random(),
    name: "Bot_" + Math.floor(Math.random() * 999)
  };
}

// INPUT
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key === "Escape") togglePause();
});
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// START
function startGame() {
  let n = document.getElementById("nameInput").value;
  player.name = n || "Player_" + Math.floor(Math.random() * 999);

  document.getElementById("menu").style.display = "none";
  running = true;
  loop();
}

function resumeGame() {
  paused = false;
  document.getElementById("pauseMenu").style.display = "none";
}

function exitGame() {
  location.reload();
}

function togglePause() {
  if (!running) return;
  paused = !paused;

  document.getElementById("pauseMenu").style.display =
    paused ? "flex" : "none";
}

// UTIL
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function size(m){ return 5 + Math.sqrt(m)*3; }

// PLAYER UPDATE (STAMINA + SPEED BOOST)
function updatePlayer() {

  let sp = player.speed;

  if ((keys["shift"] || keys[" "]) && player.stamina > 0) {
    sp *= 1.8;
    player.stamina -= 0.7;
  } else {
    player.stamina += 0.3;
  }

  player.stamina = Math.max(0, Math.min(100, player.stamina));

  if (keys["w"] || keys["arrowup"]) player.y -= sp;
  if (keys["s"] || keys["arrowdown"]) player.y += sp;
  if (keys["a"] || keys["arrowleft"]) player.x -= sp;
  if (keys["d"] || keys["arrowright"]) player.x += sp;

  player.x = Math.max(0, Math.min(world.w, player.x));
  player.y = Math.max(0, Math.min(world.h, player.y));

  for (let i = foods.length - 1; i >= 0; i--) {
    if (dist(player, foods[i]) < size(player.mass)) {
      player.mass++;
      foods[i] = spawnFood(), foods.splice(i,1);
    }
  }

  // PLAYER EATS / DIES
  for (let i = bots.length - 1; i >= 0; i--) {
    let b = bots[i];

    if (size(player.mass) > size(b.mass) * 1.2 && dist(player,b) < size(player.mass)) {
      player.mass += b.mass * 0.8;
      bots.splice(i,1);
      bots.push(createBot());
    }

    if (size(b.mass) > size(player.mass) * 1.2 && dist(player,b) < size(b.mass)) {
      player.mass = 20;
      player.x = 2000;
      player.y = 2000;
      player.stamina = 100;
    }
  }
}

// BOT AI (simple smart)
function updateBots() {
  for (let b of bots) {

    let target = foods[0];

    for (let f of foods) {
      if (dist(b,f) < dist(b,target)) target = f;
    }

    let a = Math.atan2(target.y-b.y, target.x-b.x);
    b.x += Math.cos(a)*b.speed;
    b.y += Math.sin(a)*b.speed;

    for (let i = foods.length-1;i>=0;i--) {
      if (dist(b,foods[i]) < size(b.mass)) {
        b.mass++;
        foods.splice(i,1);
        foods.push(spawnFood());
      }
    }
  }
}

// CAMERA
const camSpeed = 0.08;
function updateCamera() {
  cam.x += (player.x - innerWidth/2 - cam.x) * camSpeed;
  cam.y += (player.y - innerHeight/2 - cam.y) * camSpeed;
}

// LEADERBOARD
function updateLeaderboard() {
  let list = [...bots, player]
    .sort((a,b)=>b.mass-a.mass)
    .slice(0,10);

  document.getElementById("leaderboard").innerHTML =
    "<b>TOP 10</b><br>" +
    list.map((p,i)=> `${i+1}. ${p.name||"Player"} (${Math.floor(p.mass)})`).join("<br>");
}

// DRAW
function draw() {
  ctx.fillStyle="#050510";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.save();
  ctx.translate(-cam.x,-cam.y);

  for (let f of foods) {
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  for (let b of bots) {
    ctx.fillStyle="cyan";
    ctx.beginPath();
    ctx.arc(b.x,b.y,size(b.mass),0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.fillText(b.name,b.x-10,b.y-15);
  }

  ctx.fillStyle="lime";
  ctx.beginPath();
  ctx.arc(player.x,player.y,size(player.mass),0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.fillText(player.name,player.x-10,player.y-15);

  ctx.restore();

  document.getElementById("hud").innerHTML =
    `Mass: ${Math.floor(player.mass)} | Stamina: ${Math.floor(player.stamina)}`;
}

// LOOP
function loop() {
  if (!running) return;
  if (!paused) {
    updatePlayer();
    updateBots();
    updateCamera();
    updateLeaderboard();
    draw();
  }
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
