<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle, #0a0a1a, #000);
  font-family: Arial;
}

canvas { display:block; }

/* HUD */
#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
}

/* MENU */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, #1a1a2e, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}

input, select {
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  text-align: center;
}

button {
  margin-top: 10px;
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: limegreen;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="menu">
  <h1>PLAYDEX IO</h1>

  <input id="nameInput" placeholder="Enter name">

  <label>Choose Color</label>
  <input type="color" id="colorPick" value="#00ff00">

  <button onclick="startGame()">Start</button>
</div>

<div id="hud"></div>

<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

// WORLD
const world = { w: 3000, h: 3000 };

// CAMERA
const cam = { x:0, y:0 };

// PLAYER
const player = {
  x: world.w/2,
  y: world.h/2,
  mass: 20,
  speed: 4,
  name: "Player",
  color: "#00ff00"
};

// INPUT
const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// FOOD
const food = [];
for(let i=0;i<500;i++){
  food.push({x:Math.random()*world.w,y:Math.random()*world.h,r:3});
}

// NAMES
const names = [
"Shadow","Pixel","Nova","Blaze","XxPro","LilCat","MegaDog",
"UltraKid","DarkLord","CrazyBean","NoobMaster","Ghost","Echo"
];

function randName(){
  return names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
}

// BOTS
const bots = [];
for(let i=0;i<40;i++){
  bots.push({
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    mass:10+Math.random()*30,
    speed:1.5+Math.random(),
    name:randName(),
    color:`hsl(${Math.random()*360},70%,60%)`
  });
}

// START
function startGame(){
  player.name = document.getElementById("nameInput").value || randName();
  player.color = document.getElementById("colorPick").value;

  document.getElementById("menu").style.display="none";
  loop();
}

// UTIL
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function size(m){return 5+Math.sqrt(m)*3;}

// PLAYER
function updatePlayer(){
  let sp = player.speed;

  if(keys["w"]||keys["arrowup"]) player.y-=sp;
  if(keys["s"]||keys["arrowdown"]) player.y+=sp;
  if(keys["a"]||keys["arrowleft"]) player.x-=sp;
  if(keys["d"]||keys["arrowright"]) player.x+=sp;

  player.x=Math.max(0,Math.min(world.w,player.x));
  player.y=Math.max(0,Math.min(world.h,player.y));

  for(let i=food.length-1;i>=0;i--){
    if(dist(player,food[i]) < size(player.mass)){
      player.mass++;
      food[i]={x:Math.random()*world.w,y:Math.random()*world.h,r:3};
    }
  }
}

// BOTS AI
function updateBots(){
  for(let b of bots){
    let target=food[0];

    for(let f of food){
      if(dist(b,f)<dist(b,target)) target=f;
    }

    let a=Math.atan2(target.y-b.y,target.x-b.x);
    b.x+=Math.cos(a)*b.speed;
    b.y+=Math.sin(a)*b.speed;

    for(let i=food.length-1;i>=0;i--){
      if(dist(b,food[i])<size(b.mass)){
        b.mass++;
        food[i]={x:Math.random()*world.w,y:Math.random()*world.h,r:3};
      }
    }
  }
}

// CAMERA
function updateCamera(){
  cam.x += (player.x-innerWidth/2-cam.x)*0.08;
  cam.y += (player.y-innerHeight/2-cam.y)*0.08;
}

// DRAW FANCY
function draw(){
  ctx.fillStyle="#050510";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-cam.x,-cam.y);

  // FOOD
  for(let f of food){
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  // BOTS
  for(let b of bots){
    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,size(b.mass),0,Math.PI*2);
    ctx.fill();

    // CENTER NAME (FIXED)
    ctx.fillStyle="white";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    ctx.fillText(b.name,b.x,b.y);
  }

  // PLAYER (FANCY GLOW)
  ctx.shadowBlur=20;
  ctx.shadowColor=player.color;

  ctx.fillStyle=player.color;
  ctx.beginPath();
  ctx.arc(player.x,player.y,size(player.mass),0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  // CENTER NAME
  ctx.fillStyle="white";
  ctx.font="14px Arial";
  ctx.textAlign="center";
  ctx.fillText(player.name,player.x,player.y);

  ctx.restore();

  document.getElementById("hud").innerHTML=
    `Mass: ${Math.floor(player.mass)}`;
}

// LOOP
function loop(){
  updatePlayer();
  updateBots();
  updateCamera();
  draw();
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
