<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:#070716;
  font-family:Arial;
}

canvas { display:block; }

/* MENU */
#menu {
  position:absolute;
  width:100%;
  height:100%;
  background:radial-gradient(circle,#1a1a2e,#000);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
}

input {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  text-align:center;
}

button {
  padding:12px 25px;
  border:none;
  border-radius:10px;
  background:limegreen;
  cursor:pointer;
}

/* HUD */
#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
}

/* LEADERBOARD */
#lb {
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,0.4);
  padding:10px;
  border-radius:10px;
  color:white;
  width:180px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>PLAYDEX IO</h1>

  <input id="name" placeholder="Enter name">
  <input type="color" id="color" value="#00ff00">

  <button onclick="startGame()">Start</button>
</div>

<div id="hud"></div>
<div id="lb"></div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

// WORLD
const world={w:3500,h:3500};

// CAMERA
const cam={x:0,y:0};

// PLAYER
let player={
  x:world.w/2,
  y:world.h/2,
  mass:20,
  name:"Player",
  color:"#00ff00"
};

// INPUT
const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// FOOD
const food=[];
for(let i=0;i<600;i++) food.push(spawnFood());

function spawnFood(){
  return {x:Math.random()*world.w,y:Math.random()*world.h,r:3};
}

// NAME SYSTEM
const names=["Shadow","Pixel","Nova","Blaze","King","Noob","Ghost","Ultra","Lil","Pro"];

function randName(){
  return names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
}

// BOT LIMIT = 20
const bots=[];
for(let i=0;i<20;i++) bots.push(createBot());

function createBot(){
  return {
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    mass:5+Math.random()*80, // BIG OR SMALL START
    speed:1.2+Math.random(),
    name:randName(),
    color:`hsl(${Math.random()*360},70%,60%)`
  };
}

// START
function startGame(){
  player.name=document.getElementById("name").value||randName();
  player.color=document.getElementById("color").value;

  document.getElementById("menu").style.display="none";
  loop();
}

// UTILS
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function size(m){return 5+Math.sqrt(m)*3;}

// PLAYER
function updatePlayer(){

  let sp=4;

  if(keys["w"]||keys["arrowup"]) player.y-=sp;
  if(keys["s"]||keys["arrowdown"]) player.y+=sp;
  if(keys["a"]||keys["arrowleft"]) player.x-=sp;
  if(keys["d"]||keys["arrowright"]) player.x+=sp;

  player.x=Math.max(0,Math.min(world.w,player.x));
  player.y=Math.max(0,Math.min(world.h,player.y));

  // eat food
  for(let i=food.length-1;i>=0;i--){
    if(dist(player,food[i])<size(player.mass)){
      player.mass++;
      food[i]=spawnFood();
    }
  }

  // PLAYER vs BOTS (FIXED RULES)
  for(let i=bots.length-1;i>=0;i--){
    let b=bots[i];

    let pS=size(player.mass);
    let bS=size(b.mass);
    let d=dist(player,b);

    // player eats bot
    if(pS>bS*1.15 && d<pS){
      player.mass+=b.mass*0.8;
      bots.splice(i,1);
      bots.push(createBot());
    }

    // bot eats player
    if(bS>pS*1.15 && d<bS){
      player.mass=20;
      player.x=world.w/2;
      player.y=world.h/2;
    }
  }
}

// BOT AI (REAL IO LOGIC)
function updateBots(){

  const R=450;

  for(let b of bots){

    let bS=size(b.mass);

    let target=null;
    let threat=null;

    let bestT=99999;
    let bestH=99999;

    // scan bots
    for(let o of bots){
      if(o===b) continue;

      let d=dist(b,o);
      let oS=size(o.mass);

      // hunt smaller
      if(bS>oS*1.15 && d<R && d<bestT){
        target=o;
        bestT=d;
      }

      // flee bigger
      if(oS>bS*1.15 && d<R && d<bestH){
        threat=o;
        bestH=d;
      }
    }

    // player interaction
    let pd=dist(b,player);

    if(size(player.mass)<bS*0.85 && pd<R){
      if(pd<bestT){ target=player; bestT=pd; }
    }

    if(size(player.mass)>bS*1.15 && pd<R){
      if(pd<bestH){ threat=player; bestH=pd; }
    }

    let tx=b.x,ty=b.y;

    if(threat){
      let a=Math.atan2(b.y-threat.y,b.x-threat.x);
      tx=b.x+Math.cos(a)*120;
      ty=b.y+Math.sin(a)*120;
    } else if(target){
      tx=target.x;
      ty=target.y;
    } else {
      tx+=Math.random()*10-5;
      ty+=Math.random()*10-5;
    }

    let a=Math.atan2(ty-b.y,tx-b.x);
    b.x+=Math.cos(a)*b.speed;
    b.y+=Math.sin(a)*b.speed;

    // eat food
    for(let i=food.length-1;i>=0;i--){
      if(dist(b,food[i])<bS){
        b.mass+=0.5;
        food[i]=spawnFood();
      }
    }

    // eat bots
    for(let i=bots.length-1;i>=0;i--){
      let o=bots[i];
      if(o===b) continue;

      if(bS>size(o.mass)*1.15 && dist(b,o)<bS){
        b.mass+=o.mass*0.7;
        bots.splice(i,1);
        bots.push(createBot());
      }
    }
  }
}

// CAMERA SMOOTH
function updateCam(){
  cam.x+=(player.x-innerWidth/2-cam.x)*0.08;
  cam.y+=(player.y-innerHeight/2-cam.y)*0.08;
}

// DRAW
function draw(){

  ctx.fillStyle="#070716";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-cam.x,-cam.y);

  // FOOD
  ctx.fillStyle="red";
  for(let f of food){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  // BOTS
  for(let b of bots){
    let s=size(b.mass);

    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,s,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="12px Arial";
    ctx.fillText(b.name,b.x,b.y);
  }

  // PLAYER
  let ps=size(player.mass);

  ctx.fillStyle=player.color;
  ctx.beginPath();
  ctx.arc(player.x,player.y,ps,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="14px Arial";
  ctx.fillText(player.name,player.x,player.y);

  ctx.restore();

  document.getElementById("hud").innerHTML=
    "Mass: "+Math.floor(player.mass);
}

// LEADERBOARD
function lb(){

  let list=[...bots,player]
    .sort((a,b)=>b.mass-a.mass)
    .slice(0,10);

  document.getElementById("lb").innerHTML=
    "<b>TOP 10</b><br>"+
    list.map((p,i)=>`${i+1}. ${p.name} (${Math.floor(p.mass)})`).join("<br>");
}

// LOOP
function loop(){
  updatePlayer();
  updateBots();
  updateCam();
  lb();
  draw();
  requestAnimationFrame(loop);
}
</script>

</body>
</html>
