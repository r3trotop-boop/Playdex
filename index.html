<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WORLD
const world = {
  width: 3000,
  height: 3000
};

// CAMERA
const cam = { x: 0, y: 0 };

// PLAYER
const player = {
  x: 1500,
  y: 1500,
  size: 20,
  speed: 3.5,
  score: 0
};

// ⭐ MORE FOOD SETTINGS
const MAX_FOOD = 600;   // <- increased dots
let foods = [];

function spawnFood() {
  foods.push({
    x: Math.random() * world.width,
    y: Math.random() * world.height,
    size: 3 + Math.random() * 3
  });
}

// fill world with food
for (let i = 0; i < MAX_FOOD; i++) {
  spawnFood();
}

// BOTS
let bots = [];
for (let i = 0; i < 8; i++) {
  bots.push({
    x: Math.random() * world.width,
    y: Math.random() * world.height,
    size: 18
  });
}

// CONTROLS
const keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

let running = false;

function startGame() {
  document.getElementById("menu").style.display = "none";
  running = true;
  loop();
}

// COLLISION
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// PLAYER UPDATE
function updatePlayer() {
  if (keys["w"] || keys["ArrowUp"]) player.y -= player.speed;
  if (keys["s"] || keys["ArrowDown"]) player.y += player.speed;
  if (keys["a"] || keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["d"] || keys["ArrowRight"]) player.x += player.speed;

  player.x = Math.max(0, Math.min(world.width, player.x));
  player.y = Math.max(0, Math.min(world.height, player.y));

  // eat food
  for (let i = foods.length - 1; i >= 0; i--) {
    let f = foods[i];
    if (Math.hypot(player.x - f.x, player.y - f.y) < player.size) {
      player.size += 0.3;
      player.score++;
      foods.splice(i, 1);

      // respawn instantly so map stays FULL
      spawnFood();
    }
  }
}

// BOT AI (simple)
function updateBots() {
  bots.forEach(b => {
    let target = foods[0];

    foods.forEach(f => {
      if (Math.hypot(b.x - f.x, b.y - f.y) < Math.hypot(b.x - target.x, b.y - target.y)) {
        target = f;
      }
    });

    let angle = Math.atan2(target.y - b.y, target.x - b.x);
    b.x += Math.cos(angle) * 2;
    b.y += Math.sin(angle) * 2;
  });
}

// CAMERA
function updateCamera() {
  cam.x += (player.x - canvas.width / 2 - cam.x) * 0.08;
  cam.y += (player.y - canvas.height / 2 - cam.y) * 0.08;
}

// DRAW
function draw() {
  ctx.fillStyle = "#0b0b0f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // FOOD
  for (let f of foods) {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
    ctx.fill();
  }

  // PLAYER
  ctx.fillStyle = "lime";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + player.score, 20, 30);
}

// LOOP
function loop() {
  if (!running) return;

  updatePlayer();
  updateBots();
  updateCamera();
  draw();

  requestAnimationFrame(loop);
}
</script>
