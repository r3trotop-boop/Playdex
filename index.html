<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #050510;
  font-family: Arial;
}

canvas {
  display: block;
}

/* MENU */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1a1a2e, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}

h1 {
  font-size: 60px;
  margin: 0;
  text-shadow: 0 0 20px lime;
}

input {
  margin-top: 15px;
  padding: 10px;
  font-size: 18px;
  border-radius: 8px;
  border: none;
  outline: none;
  text-align: center;
}

button {
  margin-top: 15px;
  padding: 12px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: limegreen;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px lime;
}
</style>
</head>

<body>

<div id="menu">
  <h1>PLAYDEX IO</h1>
  <p>Eat. Grow. Dominate.</p>

  <input id="nameInput" placeholder="Enter name or leave blank">

  <button onclick="startGame()">Start</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WORLD
const world = { w: 4000, h: 4000 };

// CAMERA
const cam = { x: 0, y: 0 };

// PLAYER
let player = {
  x: 2000,
  y: 2000,
  mass: 20,
  speed: 4,
  name: "",
  score: 0
};

// FOOD
const foods = [];
const FOOD_COUNT = 700;

// BOTS
const bots = [];
const BOT_COUNT = 12;

// INPUT
const keys = {};

// NAME GENERATOR
const names = ["Nova", "Blaze", "Pixel", "Shadow", "Echo", "Vex", "Luna", "Drift", "Zen", "Rex"];

function randomName() {
  return names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 99);
}

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let running = false;

// FOOD
function spawnFood() {
  foods.push({
    x: Math.random() * world.w,
    y: Math.random() * world.h,
    r: 3 + Math.random() * 2
  });
}

for (let i = 0; i < FOOD_COUNT; i++) spawnFood();

// BOT CREATE (random size)
function createBot() {
  return {
    x: Math.random() * world.w,
    y: Math.random() * world.h,
    mass: 10 + Math.random() * 40,
    speed: 1.5 + Math.random() * 1.5,
    name: randomName()
  };
}

for (let i = 0; i < BOT_COUNT; i++) {
  bots.push(createBot());
}

// START
function startGame() {
  let input = document.getElementById("nameInput").value;
  player.name = input.trim() !== "" ? input : randomName();

  document.getElementById("menu").style.display = "none";
  running = true;
  loop();
}

// DIST
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// SIZE FROM MASS
function size(mass) {
  return 5 + Math.sqrt(mass) * 3;
}

// PLAYER UPDATE
function updatePlayer() {
  let sp = player.speed;

  if (keys["w"] || keys["arrowup"]) player.y -= sp;
  if (keys["s"] || keys["arrowdown"]) player.y += sp;
  if (keys["a"] || keys["arrowleft"]) player.x -= sp;
  if (keys["d"] || keys["arrowright"]) player.x += sp;

  player.x = Math.max(0, Math.min(world.w, player.x));
  player.y = Math.max(0, Math.min(world.h, player.y));

  for (let i = foods.length - 1; i >= 0; i--) {
    if (dist(player, foods[i]) < size(player.mass)) {
      player.mass += 1;
      player.score++;
      foods[i] = {
        x: Math.random() * world.w,
        y: Math.random() * world.h,
        r: 3 + Math.random() * 2
      };
    }
  }
}

// SMART BOT AI
function updateBots() {
  for (let b of bots) {

    let mySize = size(b.mass);
    let pSize = size(player.mass);

    // flee if player bigger
    if (pSize > mySize * 1.2 && dist(b, player) < 250) {
      let angle = Math.atan2(b.y - player.y, b.x - player.x);
      b.x += Math.cos(angle) * b.speed * 1.5;
      b.y += Math.sin(angle) * b.speed * 1.5;
      continue;
    }

    // otherwise chase food
    let target = foods[0];

    for (let f of foods) {
      if (dist(b, f) < dist(b, target)) target = f;
    }

    let a = Math.atan2(target.y - b.y, target.x - b.x);
    b.x += Math.cos(a) * b.speed;
    b.y += Math.sin(a) * b.speed;

    // eat food
    for (let i = foods.length - 1; i >= 0; i--) {
      if (dist(b, foods[i]) < mySize) {
        b.mass += 0.5;
        foods[i] = {
          x: Math.random() * world.w,
          y: Math.random() * world.h,
          r: 3 + Math.random() * 2
        };
      }
    }
  }
}

// CAMERA
function updateCamera() {
  cam.x += (player.x - canvas.width / 2 - cam.x) * 0.08;
  cam.y += (player.y - canvas.height / 2 - cam.y) * 0.08;
}

// DRAW
function draw() {
  ctx.fillStyle = "#050510";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // FOOD
  for (let f of foods) {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // BOTS
  for (let b of bots) {
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(b.x, b.y, size(b.mass), 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "12px Arial";
    ctx.fillText(b.name, b.x - 10, b.y - 20);
  }

  // PLAYER
  ctx.fillStyle = "lime";
  ctx.beginPath();
  ctx.arc(player.x, player.y, size(player.mass), 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.font = "14px Arial";
  ctx.fillText(player.name, player.x - 10, player.y - 20);

  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + player.score, 20, 30);
}

// LOOP
function loop() {
  if (!running) return;

  updatePlayer();
  updateBots();
  updateCamera();
  draw();

  requestAnimationFrame(loop);
}
</script>

</body>
</html>
