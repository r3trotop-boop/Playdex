<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Playdex IO Core</title>

<style>
body {
  margin:0;
  overflow:hidden;
  background:#050514;
  font-family:Arial;
}

canvas { display:block; }

#hud {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
}

#lb {
  position:absolute;
  top:10px;
  right:10px;
  color:white;
  background:rgba(0,0,0,0.4);
  padding:10px;
  border-radius:10px;
  width:180px;
}
</style>
</head>

<body>

<div id="hud"></div>
<div id="lb"></div>
<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

// WORLD
const world = { w: 4000, h: 4000 };

// CAMERA (SMOOTH)
const cam = { x:0, y:0 };

// PLAYER
const player = {
  x: 2000,
  y: 2000,
  mass: 20,
  name: "Player",
  color: "lime"
};

// INPUT
const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// FOOD
const food = [];
for(let i=0;i<600;i++) spawnFood();

function spawnFood(){
  food.push({
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    r:3
  });
}

// NAME SYSTEM
const names = ["Shadow","Pixel","Nova","Blaze","King","Noob","Ghost","Ultra","XxPro","Bot"];

function randName(){
  return names[Math.floor(Math.random()*names.length)] + Math.floor(Math.random()*99);
}

// BOTS (50 WITH RANDOM SIZE)
const bots = [];
for(let i=0;i<50;i++){
  bots.push({
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    mass:10+Math.random()*60,
    speed:1.3+Math.random(),
    name:randName()
  });
}

// UTIL
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function size(m){return 5+Math.sqrt(m)*3;}

// PLAYER UPDATE
function updatePlayer(){
  let sp = 4;

  if(keys["w"]||keys["arrowup"]) player.y-=sp;
  if(keys["s"]||keys["arrowdown"]) player.y+=sp;
  if(keys["a"]||keys["arrowleft"]) player.x-=sp;
  if(keys["d"]||keys["arrowright"]) player.x+=sp;

  player.x=Math.max(0,Math.min(world.w,player.x));
  player.y=Math.max(0,Math.min(world.h,player.y));

  // eat food
  for(let i=food.length-1;i>=0;i--){
    if(dist(player,food[i]) < size(player.mass)){
      player.mass++;
      food.splice(i,1);
      spawnFood();
    }
  }
}

// BOT AI (REAL IO LOGIC)
function updateBots(){

  const RADIUS = 450;

  for(let b of bots){

    let bSize = size(b.mass);

    let target = null;
    let bestDist = Infinity;

    let threat = null;
    let threatDist = Infinity;

    // scan environment
    for(let other of bots){

      if(other === b) continue;

      let d = dist(b,other);
      let oSize = size(other.mass);

      // prey
      if(bSize > oSize*1.15 && d < RADIUS){
        if(d < bestDist){
          bestDist = d;
          target = other;
        }
      }

      // threat
      if(oSize > bSize*1.15 && d < RADIUS){
        if(d < threatDist){
          threatDist = d;
          threat = other;
        }
      }
    }

    // player as target/threat
    let pd = dist(b,player);

    if(size(player.mass) < bSize*0.85 && pd < RADIUS){
      if(pd < bestDist){
        bestDist = pd;
        target = player;
      }
    }

    if(size(player.mass) > bSize*1.15 && pd < RADIUS){
      if(pd < threatDist){
        threatDist = pd;
        threat = player;
      }
    }

    let tx = b.x;
    let ty = b.y;

    // flee first
    if(threat){
      let a = Math.atan2(b.y - threat.y, b.x - threat.x);
      tx = b.x + Math.cos(a)*120;
      ty = b.y + Math.sin(a)*120;
    }
    // then hunt
    else if(target){
      tx = target.x;
      ty = target.y;
    }
    // else wander slightly
    else {
      tx = b.x + (Math.random()-0.5)*40;
      ty = b.y + (Math.random()-0.5)*40;
    }

    let a = Math.atan2(ty-b.y, tx-b.x);
    b.x += Math.cos(a)*b.speed;
    b.y += Math.sin(a)*b.speed;

    // eat food
    for(let i=food.length-1;i>=0;i--){
      if(dist(b,food[i]) < bSize){
        b.mass += 0.5;
        food.splice(i,1);
        spawnFood();
      }
    }

    // eat bots
    for(let i=bots.length-1;i>=0;i--){
      let o = bots[i];
      if(o===b) continue;

      if(bSize > size(o.mass)*1.2 && dist(b,o) < bSize){
        b.mass += o.mass*0.7;
        bots.splice(i,1);
        bots.push(createBot());
      }
    }

    // eat player
    if(bSize > size(player.mass)*1.2 && pd < bSize){
      player.mass = 20;
      player.x = 2000;
      player.y = 2000;
    }
  }
}

function createBot(){
  return {
    x:Math.random()*world.w,
    y:Math.random()*world.h,
    mass:10+Math.random()*60,
    speed:1.3+Math.random(),
    name:randName()
  };
}

// CAMERA SMOOTH
function updateCamera(){
  cam.x += (player.x - innerWidth/2 - cam.x)*0.08;
  cam.y += (player.y - innerHeight/2 - cam.y)*0.08;
}

// DRAW
function draw(){
  ctx.fillStyle="#050514";
  ctx.fillRect(0,0,c.width,c.height);

  ctx.save();
  ctx.translate(-cam.x,-cam.y);

  // FOOD
  ctx.fillStyle="red";
  for(let f of food){
    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fill();
  }

  // BOTS
  for(let b of bots){
    let s = size(b.mass);

    ctx.fillStyle="cyan";
    ctx.beginPath();
    ctx.arc(b.x,b.y,s,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="12px Arial";
    ctx.fillText(b.name,b.x,b.y);
  }

  // PLAYER
  ctx.fillStyle="lime";
  ctx.beginPath();
  ctx.arc(player.x,player.y,size(player.mass),0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.textAlign="center";
  ctx.font="14px Arial";
  ctx.fillText(player.name,player.x,player.y);

  ctx.restore();

  // HUD
  document.getElementById("hud").innerHTML =
    "Mass: " + Math.floor(player.mass);
}

// LEADERBOARD
function updateLB(){
  let list = [...bots, player]
    .sort((a,b)=>b.mass-a.mass)
    .slice(0,10);

  document.getElementById("lb").innerHTML =
    "<b>TOP 10</b><br>" +
    list.map((p,i)=>`${i+1}. ${p.name} (${Math.floor(p.mass)})`).join("<br>");
}

// LOOP
function loop(){
  updatePlayer();
  updateBots();
  updateCamera();
  updateLB();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
