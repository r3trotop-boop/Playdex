<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playdex IO</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
}

/* CANVAS */
canvas {
  display: block;
}

/* START SCREEN */
#menu {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #1a1a2e, #000);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  animation: fadeIn 1.2s ease;
}

h1 {
  font-size: 60px;
  margin: 0;
  text-shadow: 0 0 20px lime;
}

p {
  opacity: 0.7;
}

button {
  margin-top: 20px;
  padding: 15px 35px;
  font-size: 20px;
  border: none;
  border-radius: 12px;
  background: limegreen;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px lime;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div id="menu">
  <h1>PLAYDEX IO</h1>
  <p>Eat. Grow. Dominate.</p>
  <button onclick="startGame()">Start</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// WORLD
const world = { w: 4000, h: 4000 };

// CAMERA
const cam = { x: 0, y: 0 };

// PLAYER
const player = {
  x: 2000,
  y: 2000,
  r: 20,
  speed: 4,
  score: 0
};

// FOOD
const foods = [];
const FOOD_COUNT = 700;

// BOT
const bots = [];
const BOT_COUNT = 10;

// INPUT
const keys = {};

window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let running = false;

// CREATE FOOD
function spawnFood() {
  foods.push({
    x: Math.random() * world.w,
    y: Math.random() * world.h,
    r: 3 + Math.random() * 2
  });
}

for (let i = 0; i < FOOD_COUNT; i++) spawnFood();

// CREATE BOTS
for (let i = 0; i < BOT_COUNT; i++) {
  bots.push({
    x: Math.random() * world.w,
    y: Math.random() * world.h,
    r: 18,
    speed: 1.5 + Math.random()
  });
}

// START GAME
function startGame() {
  document.getElementById("menu").style.display = "none";
  running = true;
  loop();
}

// DIST
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// PLAYER
function updatePlayer() {
  let sp = player.speed;

  if (keys["w"] || keys["arrowup"]) player.y -= sp;
  if (keys["s"] || keys["arrowdown"]) player.y += sp;
  if (keys["a"] || keys["arrowleft"]) player.x -= sp;
  if (keys["d"] || keys["arrowright"]) player.x += sp;

  player.x = Math.max(0, Math.min(world.w, player.x));
  player.y = Math.max(0, Math.min(world.h, player.y));

  for (let i = foods.length - 1; i >= 0; i--) {
    if (dist(player, foods[i]) < player.r) {
      player.r += 0.25;
      player.score++;
      foods[i] = {
        x: Math.random() * world.w,
        y: Math.random() * world.h,
        r: 3 + Math.random() * 2
      };
    }
  }
}

// BOTS
function updateBots() {
  for (let b of bots) {
    let target = foods[0];

    for (let f of foods) {
      if (dist(b, f) < dist(b, target)) target = f;
    }

    let a = Math.atan2(target.y - b.y, target.x - b.x);
    b.x += Math.cos(a) * b.speed;
    b.y += Math.sin(a) * b.speed;
  }
}

// CAMERA (smooth follow + slight zoom feel)
function updateCamera() {
  cam.x += (player.x - canvas.width / 2 - cam.x) * 0.08;
  cam.y += (player.y - canvas.height / 2 - cam.y) * 0.08;
}

// DRAW
function draw() {
  ctx.fillStyle = "#050510";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // GRID (fancy)
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  for (let x = 0; x < world.w; x += 100) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, world.h);
    ctx.stroke();
  }

  for (let y = 0; y < world.h; y += 100) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(world.w, y);
    ctx.stroke();
  }

  // FOOD
  for (let f of foods) {
    ctx.fillStyle = "rgba(255,60,60,0.9)";
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // BOTS (glow)
  ctx.shadowBlur = 15;
  ctx.shadowColor = "cyan";

  for (let b of bots) {
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // PLAYER (strong glow)
  ctx.shadowBlur = 25;
  ctx.shadowColor = "lime";

  ctx.fillStyle = "lime";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.restore();

  // UI
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + player.score, 20, 30);
}

// LOOP
function loop() {
  if (!running) return;

  updatePlayer();
  updateBots();
  updateCamera();
  draw();

  requestAnimationFrame(loop);
}
</script>

</body>
</html>
